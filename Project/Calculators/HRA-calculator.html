<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRA Calculator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="HRA-calculator.css">
  </head>
  <body>
    <div class="calculator-container">
      <h2>HRA Calculator</h2>
      <div class="card-container">
        <div class="input-card">
          <div class="input-row">
            <label>Basic Salary(₹):</label>
            <input type="number" value="5400000" class="value-input" />
          </div>
          <div class="slider-container">
            <input
              type="range"
              class="teal-slider"
              id="basic-salary-slider"
              min="1000"
              max="100000000"
              value="5400000"
            />
          </div>
          <div class="input-row">
            <label>Dearness Allowance (₹):</label>
            <input type="number" value="0" class="value-input" />
          </div>
          <div class="slider-container">
            <input
              type="range"
              class="teal-slider"
              id="dearness-allowance-slider"
              min="0"
              max="50000"
              value="0"
            />
          </div>
          <div class="input-row">
            <label>HRA Received (₹):</label>
            <input type="number" value="100000" class="value-input" />
          </div>
          <div class="slider-container">
            <input
              type="range"
              class="teal-slider"
              id="hra-received-slider"
              min="0"
              max="1000000"
              value="100000"
            />
          </div>
          <div class="input-row">
            <label>Rent Paid (₹):</label>
            <input type="number" value="300000" class="value-input" />
          </div>
          <div class="slider-container">
            <input
              type="range"
              class="teal-slider"
              id="rent-paid-slider"
              min="1000"
              max="1000000"
              value="300000"
            />
            <div class="input-radio-button">
                <div class="input-label">
                    <label> Are you working in Metro City?</label>
                </div>
                <div class="input-option">
                    <input type="radio" name="metro-city" value="yes" checked> Yes
                    <input type="radio" name="metro-city" value="no"> No
                </div>
            </div>
          </div>
        </div>
        
        <div class="output-card">
            <h3>HRA Calculation</h3>
            <hr class="seperator-line" />
          <div class="output-box">
            <div class="output-row">
                <span class="HRA-text">Extempted HRA</span>
                <span class="HRA-value">0</span>
            </div>
            <div class="output-row">
                <span class="HRA-text">Taxable HRA</span>
                <span class="HRA-value">0</span>
            </div>
        </div>
      </div>
    </div>
    <script src="HRA-calculator.js"></script>
  </body>
</html>
