<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gratuity Calculator</title>
    <link rel="stylesheet" href="Gratuity-calculator.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="calculator-container">
      <h2>Gratuity Calculator</h2>
      <div class="card-container">
        <div class="input-card">
          <div class="input-row">
            <label>Monthly Salary (Basic+DA)(₹):</label>
            <input type="number" value="5000" class="value-input" />
          </div>
          <div class="slider-container">
            <input
              type="range"
              class="teal-slider"
              id="monthly-salary-slider"
              min="0"
              max="100000"
              value="5000"
            />
          </div>
          <div class="input-row">
            <label>Years of Service:</label>
            <input type="number" value="5" class="value-input" />
          </div>
          <div class="slider-container">
            <input
              type="range"
              class="teal-slider"
              id="service-slider"
              min="0"
              max="100"
              value="5"
            />
          </div>
        </div>

        <div class="output-card">
          <div class="output-row">
            <span class="gratuity-amount">Your Gratuity Amount: ₹</span>
            <span class="gratuity-value">0</span>
          </div>
          <hr class="seperator-line" />
          <div class="summary-card">
            <div class="summary-row">
              <span>Monthly Salary: ₹</span>
              <span class="value-text">5,000</span>
            </div>
            <div class="summary-row">
              <span>Years of Service:</span>
              <span class="value-text">5</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="Gratuity-calculator.js"></script>
  </body>
</html>
