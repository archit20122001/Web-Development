<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPF Calculator</title>
    <style>
      :root {
        --primary-color: #3d6a58; /* Dark green from the design */
        --bg-light: #f5f5f5;
        --text-main: #333333;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .calculator-card {
        background-color: #ffffff;
        width: 100%;
        max-width: 600px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .input-section {
        padding: 30px;
      }

      .input-group {
        margin-bottom: 25px;
      }

      .input-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .input-header label {
        font-size: 16px;
        color: var(--text-main);
        font-weight: 400;
      }

      .input-header input[type="number"] {
        width: 120px;
        padding: 5px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-bottom: 2px solid #000;
        outline: none;
        text-align: left;
      }

      /* Hide number input spinners */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Custom Slider Styling */
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 8px;
        background: #d3d3d3;
        border-radius: 4px;
        outline: none;
        opacity: 0.9;
        transition: opacity 0.2s;
      }

      input[type="range"]:hover {
        opacity: 1;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--primary-color);
        cursor: pointer;
      }

      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--primary-color);
        cursor: pointer;
      }

      .output-section {
        background-color: var(--primary-color);
        color: #ffffff;
        padding: 30px;
        text-align: center;
      }

      .maturity-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 20px;
      }

      .divider {
        border: 0;
        height: 1px;
        background-color: rgba(255, 255, 255, 0.4);
        margin: 20px 0;
      }

      .details-row {
        display: flex;
        justify-content: space-between;
        padding: 0 20px;
      }

      .detail-col {
        text-align: center;
        flex: 1;
      }

      .detail-label {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .detail-value {
        font-size: 18px;
        font-weight: 300;
      }
    </style>
  </head>
  <body>
    <div class="calculator-card">
      <div class="input-section">
        <div class="input-group">
          <div class="input-header">
            <label>Yearly Deposit (₹):</label>
            <input
              type="number"
              id="depositInput"
              value="10000"
              min="500"
              max="150000"
              step="500"
            />
          </div>
          <input
            type="range"
            id="depositSlider"
            min="500"
            max="150000"
            step="500"
            value="10000"
          />
        </div>

        <div class="input-group">
          <div class="input-header">
            <label>Interest Rate (%):</label>
            <input
              type="number"
              id="interestInput"
              value="7.1"
              step="0.1"
              readonly
            />
          </div>
        </div>

        <div class="input-group">
          <div class="input-header">
            <label>Tenure (Years):</label>
            <input
              type="number"
              id="tenureInput"
              value="15"
              min="15"
              max="50"
              step="1"
            />
          </div>
          <input
            type="range"
            id="tenureSlider"
            min="15"
            max="50"
            step="1"
            value="15"
          />
        </div>
      </div>

      <div class="output-section">
        <div class="maturity-title">
          Maturity Value <span id="maturityValue">₹2,71,214</span>
        </div>
        <hr class="divider" />
        <div class="details-row">
          <div class="detail-col">
            <div class="detail-label">Invested Amount</div>
            <div class="detail-value" id="investedAmount">₹1,50,000</div>
          </div>
          <div class="detail-col">
            <div class="detail-label">Total Interest</div>
            <div class="detail-value" id="totalInterest">₹1,21,214</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // DOM Elements
      const depositInput = document.getElementById("depositInput");
      const depositSlider = document.getElementById("depositSlider");

      const interestInput = document.getElementById("interestInput");

      const tenureInput = document.getElementById("tenureInput");
      const tenureSlider = document.getElementById("tenureSlider");

      const maturityValueEl = document.getElementById("maturityValue");
      const investedAmountEl = document.getElementById("investedAmount");
      const totalInterestEl = document.getElementById("totalInterest");

      // Number Formatter for Indian Rupees
      const formatCurrency = (amount) => {
        return "₹" + Math.round(amount).toLocaleString("en-IN");
      };

      // Core Calculation Logic
      const calculatePPF = () => {
        const P = parseFloat(depositInput.value);
        const rate = parseFloat(interestInput.value);
        const n = parseFloat(tenureInput.value);
        const i = rate / 100;

        // Total Invested Amount
        const investedAmount = P * n;

        // PPF Maturity Formula (Annuity Due)
        const maturityValue = P * ((Math.pow(1 + i, n) - 1) / i) * (1 + i);

        // Total Interest Gained
        const totalInterest = maturityValue - investedAmount;

        // Update UI
        investedAmountEl.innerText = formatCurrency(investedAmount);
        maturityValueEl.innerText = formatCurrency(maturityValue);
        totalInterestEl.innerText = formatCurrency(totalInterest);

        updateSliderBackgrounds();
      };

      // Sync Sliders and Inputs
      const syncInputs = (inputEl, sliderEl) => {
        inputEl.addEventListener("input", (e) => {
          sliderEl.value = e.target.value;
          calculatePPF();
        });
        sliderEl.addEventListener("input", (e) => {
          inputEl.value = e.target.value;
          calculatePPF();
        });
      };

      // Optional: Dynamically color the slider track before the thumb
      const updateSliderBackgrounds = () => {
        const sliders = [depositSlider, tenureSlider];
        sliders.forEach((slider) => {
          const percentage =
            ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
          slider.style.background = `linear-gradient(to right, #3d6a58 0%, #3d6a58 ${percentage}%, #d3d3d3 ${percentage}%, #d3d3d3 100%)`;
        });
      };

      // Initialize listeners
      syncInputs(depositInput, depositSlider);
      syncInputs(tenureInput, tenureSlider);

      // Initial Calculation
      calculatePPF();
    </script>
  </body>
</html>
