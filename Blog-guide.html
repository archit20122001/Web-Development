<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Blog-guide.css" />
  </head>
  <body class="body-container">
    <div class="container">
      <header class="header-container">
        <h2 class="header-title">Blogareu</h2>
        <p class="header-description">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla neque
          ullam dicta recusandae nesciunt labore.
        </p>
      </header>
      <main class="main-container">
        <!-- card 1 start -->
        <div class="card-container">
          <a href="#" class="card_image_container">
            <img
              src="https://source.unsplash.com/random/600×400?healthy"
              alt="card 1 image"
              class="card_image"
              loading="lazy"
            />
          </a>

          <div class="card-title-container">
            <a href="#">
              <h2 class="card-title">New Gadgets Released</h2>
            </a>
            <p class="card-description">
              Check out the latest tech gadgets hitting the market, from
              smartphones to smartwatches.
            </p>
          </div>

          <div class="card-footer-container">
            <div class="author-container">
              <div class="author-avatar-container">
                <img
                  src="https://api.dicebear.com/7.x/notionists/svg?seed=John?size=64"
                  loading="lazy"
                  class="aithor-avatar"
                  alt="avatar 1"
                />
              </div>
              <div class="author-info-container">
                <span> John Doe </span>
                <span> Sept 19, 2021 </span>
              </div>
            </div>

            <div class="card-tag-container">
              <span>Technology</span>
            </div>
          </div>
        </div>

        <!-- card 1 ends here -->
      </main>
    </div>
  </body>
</html>
