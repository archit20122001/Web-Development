<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="cards-2.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="Media/player card.webp" alt="Player card" />
        <div class="description">
          <h2>Order Summary</h2>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. A deserunt,
            recusandae cumque omnis harum obcaecati provident.
          </p>
        </div>
        <div class="subbox">
            <div class="leftbox">
                <div class="imagebox">
                    <img src="Media/birdlogo.png" alt="birdlogo">
                </div>
                <div class="textbox">
                    <p>Annual Plan</p>
                    <p>$9.99/year</p>
                </div>
            </div>
            <div class="rightbox">
                <a href="#">Change</a>
            </div>
        </div>
        <button id="payment">Proceed to Payment</button>
        <div class="cancel">
          <a href="#">Cancel Order</a>
        </div>
      </div>
    </div>
  </body>
</html>
